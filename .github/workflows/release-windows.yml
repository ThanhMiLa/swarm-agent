name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Attach the built .exe directly to the GitHub Release'
        required: false
        type: boolean
        default: true
      publish_release:
        description: 'Publish the GitHub Release (instead of leaving it as a draft)'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Optional GitHub release tag (defaults to v<version> from tauri.conf.json)'
        required: false
        type: string
        default: ''
      run_cargo_tests:
        description: 'Run cargo fmt, clippy, and cargo test before building'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine release build target
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_UPLOAD_TO_RELEASE: ${{ inputs.upload_to_release }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if (-not $version) {
            throw "Missing version in src-tauri/tauri.conf.json"
          }
          $assetName = "SwarmAgent_${version}_x64-setup.exe"
          $defaultTag = "v$version"
          $shouldBuild = $true
          $uploadToRelease = $true
          $publishRelease = $true
          $targetTag = $defaultTag

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $uploadToRelease = ($env:INPUT_UPLOAD_TO_RELEASE -ne "false")
            $publishRelease = ($env:INPUT_PUBLISH_RELEASE -ne "false")
            $customTag = ("$($env:INPUT_RELEASE_TAG)").Trim()
            if ($customTag) {
              if ($customTag -ne $defaultTag) {
                throw "release_tag '$customTag' does not match src-tauri/tauri.conf.json version '$defaultTag'"
              }
              $targetTag = $customTag
            }
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $targetTag = $env:GITHUB_REF_NAME
            if ($targetTag -ne $defaultTag) {
              throw "Git tag '$targetTag' does not match src-tauri/tauri.conf.json version '$defaultTag'"
            }
          } elseif ($env:EVENT_NAME -eq "push") {
            # On pushes to main, build and attach automatically only if the matching
            # GitHub release already exists and does not yet have the Windows .exe.
            $prevPref = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $releaseJson = gh release view $defaultTag --repo $env:GITHUB_REPOSITORY --json assets 2>$null
            $viewExit = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            $ErrorActionPreference = $prevPref
            if ($viewExit -ne 0 -or -not $releaseJson) {
              Write-Host "Release $defaultTag does not exist yet; skipping automatic Windows release build."
              $shouldBuild = $false
            } else {
              $releaseObj = $releaseJson | ConvertFrom-Json
              $assetNames = @($releaseObj.assets | ForEach-Object { $_.name })
              if ($assetNames -contains $assetName) {
                Write-Host "Release $defaultTag already contains $assetName; skipping automatic Windows release build."
                $shouldBuild = $false
              } else {
                Write-Host "Release $defaultTag exists without $assetName; building and attaching automatically."
              }
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_tag=$targetTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "should_build=$($shouldBuild.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "upload_to_release=$($uploadToRelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish_release=$($publishRelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-node@v4
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        run: npm ci

      - name: Type-check frontend
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        run: npx tsc --noEmit

      - name: Test frontend
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        run: npm test

      - name: Check Rust formatting
        if: ${{ steps.meta.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_cargo_tests) }}
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy Rust
        if: ${{ steps.meta.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_cargo_tests) }}
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust
        if: ${{ steps.meta.outputs.should_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_cargo_tests) }}
        working-directory: src-tauri
        run: cargo test

      - name: Build NSIS installer
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        shell: pwsh
        env:
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "src-tauri/target/release/bundle/nsis/$($env:ASSET_NAME)"
          if (-not (Test-Path $setup)) {
            throw "Expected NSIS installer not found at: $setup"
          }
          Get-Item $setup | Select-Object FullName, Length

      - name: Upload installer artifact
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: SwarmAgent-${{ steps.meta.outputs.version }}-windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/${{ steps.meta.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer to GitHub Release
        if: ${{ steps.meta.outputs.should_build == 'true' && steps.meta.outputs.upload_to_release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.meta.outputs.target_tag }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          PUBLISH_RELEASE: ${{ steps.meta.outputs.publish_release }}
        run: |
          $tag = $env:TARGET_TAG
          $setup = "src-tauri/target/release/bundle/nsis/$($env:ASSET_NAME)"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $env:NOTES_FILE = $notesFile
          @'
          const fs = require('fs');
          const ver = process.env.APP_VERSION;
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n').split('\n');
          const start = lines.findIndex((l) => l.startsWith(`## [${ver}]`));
          let notes = '';
          if (start !== -1) {
            let end = lines.findIndex((l, i) => i > start && (l.startsWith('## [') || /^\[[^\]]+\]:/.test(l)));
            if (end === -1) end = lines.length;
            notes = lines.slice(start + 1, end).join('\n').trim();
          }
          fs.writeFileSync(process.env.NOTES_FILE, notes ? notes + '\n' : '');
          '@ | node -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $prevPref = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $viewJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          $exists = ($LASTEXITCODE -eq 0 -and $viewJson)
          $ErrorActionPreference = $prevPref

          $isDraft = $true
          if (-not $exists) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --title "SwarmAgent $tag" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $isDraft = ($viewJson | ConvertFrom-Json).isDraft
          }

          gh release upload $tag $setup --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($env:PUBLISH_RELEASE -eq "true" -and $isDraft) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
